name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'  # Minimum 1.24 for dependencies
          cache: true

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binaries
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist

          # Derived from the tagged commit, not from the clock, so rebuilding
          # the same tag produces byte-identical binaries.
          BUILD_DATE=$(git show -s --format=%cI "${GITHUB_SHA}")
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA} -X main.date=${BUILD_DATE}"

          build() {
            GOOS=$1 GOARCH=$2 go build -trimpath -ldflags="${LDFLAGS}" -o "dist/$3" .
          }

          build linux   amd64 netdiag-linux-amd64
          build linux   arm64 netdiag-linux-arm64
          build darwin  amd64 netdiag-darwin-amd64
          build darwin  arm64 netdiag-darwin-arm64
          build windows amd64 netdiag-windows-amd64.exe

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/netdiag-linux-amd64
            dist/netdiag-linux-arm64
            dist/netdiag-darwin-amd64
            dist/netdiag-darwin-arm64
            dist/netdiag-windows-amd64.exe
            dist/checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
